[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-lab"
version = "0.1.0"
description = "Test your prompts. Measure your models. Trust your evidence."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pratham Gupta" }]
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "testing", "ai", "benchmarking", "regression"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.7",
]
json-schema = [
    "jsonschema>=4.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "jsonschema>=4.0",
]

[project.scripts]
llm-eval = "llm_eval_lab.cli:app"

[project.urls]
Homepage = "https://github.com/prathamforgelab/LLM-Evaluation-Lab"
Repository = "https://github.com/prathamforgelab/LLM-Evaluation-Lab"
Issues = "https://github.com/prathamforgelab/LLM-Evaluation-Lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_lab"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.UploadFile",
    "typer.Argument",
    "typer.Option",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/llm_eval_lab"]
omit = ["*/tests/*"]
